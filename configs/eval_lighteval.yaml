# Default evaluation configuration for the 400M transformer model.
# Combines Lighteval benchmarks with streaming perplexity evaluation.
#
# Usage:
#   python eval_l.py --config-name=eval_lighteval_400M \
#       eval_config.load_path=/path/to/ckpt.pt

# Lighteval + perplexity settings
eval_config:
  seed: 42
  precision: amp_bf16
  device: gpu
  run_name: transformer_400M_eval
  batch_size: 8                # Used by Lighteval tasks
  eval_batch_size: 512         # Total batch size for streaming perplexity
  eval_microbatch_size: 32     # Per-forward-pass microbatch for perplexity
  max_samples: null
  load_path: s3://loop-llm/dyna/1__re_create_160M__27nov25__GwwXUl-ba3171.pt

  # Optional checkpoint to load
  # load_path: s3://loop-llm/dyna/transformer_400M/latest.pt

  # Tokenizer parameters
  tokenizer: HuggingFaceTB/SmolLM2-1.7B
  tokenizer_kwargs:
    padding_side: left
    use_fast: true

  # Lighteval task list (edit as needed)
  tasks:
    - lambada:standard
    - piqa
    - hellaswag
    - winogrande
    - arc:easy
    - arc:challenge

  # Streaming perplexity evaluation config (uses training stream mix)
  eval_loader:
    name: text
    dataset:
      streams_path: ${hydra:runtime.cwd}/configs/execute_config/streams
      max_seq_len: ${model_config.max_seq_len}
      shuffle: false
      shuffle_seed: ${eval_config.seed}
    drop_last: false
    num_workers: 4
    pin_memory: true
    prefetch_factor: 2
    persistent_workers: false
    timeout: 0
    # max_batches: 200  # Uncomment to cap perplexity runtime

  # Output logging
  output_dir: ./lighteval_transformer_400M
  save_details: true
  push_to_hub: false
  public: false
  parallelism:
    dp_size: 1
    pp_size: 1
    tp_size: 1
  launcher_type: default
  override_batch_size: null
  num_fewshot_seeds: 1
  wandb:
    enabled: false

# Model definition copied from configs/transformer_400M.yaml
model_config:
  execution_mode: transformer
  d_model: 768
  d_ffn: 3072
  n_repeats: 1
  n_heads: 12
  d_head: 64
  n_layers: 12
  vocab_size: 50368
  max_seq_len: 1024
  n_expert_shared_attn: 0
  n_expert_shared_ffn: 0
  collect_reg_loss: false
  enable_early_exit: false
  norm_structure: pre
  rescaling_method: complete_p
  loop_normalization: false
  repeat_residual: false
  sample_iterations: false
  loop_rope_theta_rebase: false
  transformer_type: dyna
  layer_type: simple
  base_depth: 2
  current_depth: 12
  base_width: 256
  current_width: 1024
  cp_alpha: 1
  sqrt_attention_scale: false
  use_embedding_norm: false
  init_sigma: 0.02
