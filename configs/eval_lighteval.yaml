# Lighteval Evaluation Configuration for Dyna Models
# This configuration file is used with eval_l.py script
#
# Usage:
#   python eval_l.py                                          # Uses this default config
#   python eval_l.py --config-name=eval_lighteval            # Explicitly use this config
#   python eval_l.py eval_config.device=cpu                  # Override device parameter
#   python eval_l.py eval_config.load_path=/path/to/ckpt.pt  # Load checkpoint
#
# Supported tasks include:
#   - mmlu (with variants like mmlu:5 for 5-shot)
#   - hellaswag
#   - arc_easy, arc_challenge
#   - truthfulqa_mc
#   - gsm8k
#   - piqa
#   - winogrande
#   - lambada_openai
#   - and many more from the Lighteval task registry

# Evaluation Configuration
eval_config:
  # Basic settings
  seed: 42
  precision: amp_bf16  # Options: fp32, fp16, amp_bf16
  device: gpu          # Options: gpu, cpu
  run_name: dyna_lighteval

  # Model checkpoint (optional)
  # load_path: /path/to/checkpoint.pt

  # Tokenizer settings
  tokenizer: HuggingFaceTB/SmolLM2-1.7B
  tokenizer_kwargs:
    trust_remote_code: false
    use_fast: true

  # Batch size for evaluation
  batch_size: 8

  # Tasks to evaluate
  # Format: "task_name" or "task_name:num_shots"
  # Examples:
  #   - "mmlu" - MMLU with default shots
  #   - "mmlu:5" - MMLU with 5-shot
  #   - "hellaswag:10" - HellaSwag with 10-shot
  tasks:
    - lambada_openai
    - piqa
    - hellaswag
    - winogrande
    - arc_easy
    - arc_challenge

  # Optional: Path to custom tasks file
  # custom_tasks_file: /path/to/custom_tasks.py

  # Output settings
  output_dir: ./lighteval_results
  save_details: true  # Save detailed per-sample results

  # Hub settings (for pushing results to HuggingFace Hub)
  push_to_hub: false
  public: false
  # hub_repo_id: username/repo-name  # Required if push_to_hub is true

  # Parallelism settings (for multi-GPU evaluation)
  parallelism:
    dp_size: 1  # Data parallelism
    pp_size: 1  # Pipeline parallelism
    tp_size: 1  # Tensor parallelism

  # Pipeline parameters
  launcher_type: default
  override_batch_size: null  # Override batch size for specific needs
  max_samples: null          # Limit number of samples (useful for debugging)
  num_fewshot_seeds: 1       # Number of different fewshot seeds to try

  # Weights & Biases logging (optional)
  wandb:
    enabled: false
    project: dyna-lighteval
    entity: null  # Your wandb entity/team name
    tags: []

# Model Configuration
# This should match your model architecture
model_config:
  execution_mode: transformer
  d_model: 768
  d_ffn: 3072
  n_repeats: 1
  n_heads: 12
  d_head: 64
  n_layers: 12
  vocab_size: 49152
  max_seq_len: 2048
  n_expert_shared_attn: 0
  n_expert_shared_ffn: 0
  collect_reg_loss: false

  # Additional model settings
  attn_config:
    attn_impl: torch  # Options: torch, flash, triton
    alibi: false
    rope: true
    rope_theta: 10000

  # Initialization settings
  init_config:
    name: kaiming_normal_
    fan_mode: fan_in
    init_nonlinearity: relu

  # Normalization
  norm_type: layernorm
  no_bias: false
