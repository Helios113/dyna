# Minimal Lighteval Configuration for Quick Testing
# Use this for rapid iteration and debugging
#
# Usage:
#   python eval_l.py --config-name=eval_lighteval_minimal

# Evaluation Configuration (Minimal for testing)
eval_config:
  seed: 42
  precision: fp32  # Use FP32 for debugging (more stable)
  device: cpu      # Use CPU for testing (no GPU required)
  batch_size: 1    # Small batch for low memory
  run_name: dyna_lighteval_test

  # Tokenizer
  tokenizer: gpt2  # Small, fast tokenizer for testing
  tokenizer_kwargs:
    use_fast: true

  # Minimal task set for quick testing
  tasks:
    - lambada_openai  # Single task, fast to evaluate

  # Limit samples for quick testing
  max_samples: 50  # Only evaluate on first 50 samples

  # Output
  output_dir: ./lighteval_test_results
  save_details: false  # Don't save detailed results for testing

  # Disable hub features
  push_to_hub: false

  # Basic parallelism (single device)
  parallelism:
    dp_size: 1
    pp_size: 1
    tp_size: 1

  # Simple pipeline
  launcher_type: default
  override_batch_size: null
  num_fewshot_seeds: 1

  # No W&B for testing
  wandb:
    enabled: false

# Minimal Model Configuration
# Small model for fast testing
model_config:
  execution_mode: transformer
  transformer_type: dyna

  # Very small model
  d_model: 256
  d_ffn: 1024
  n_heads: 4
  d_head: 64
  n_layers: 4
  n_repeats: 1

  vocab_size: 50257  # GPT-2 vocab size
  max_seq_len: 512   # Short sequences for testing

  # Basic settings
  n_expert_shared_attn: 0
  n_expert_shared_ffn: 0
  collect_reg_loss: false
  use_embedding_norm: false
  shift_labels: true

  # Attention config
  attn_config:
    attn_impl: torch
    alibi: false
    rope: false

  # Norms
  norms:
    norm_type: layernorm
    ffn_eps: 1.0e-5

  # Simple initialization
  init_config:
    name: kaiming_normal_
    fan_mode: fan_in
    init_nonlinearity: relu

  # No special features for testing
  use_energy_per_sample: false
  use_reg_loss: false
  rescaling_method: none

  # Simple depth/width settings
  base_depth: 4
  current_depth: 4
  base_width: 256
  current_width: 256
  init_sigma: 0.02
  cp_alpha: 1.0
  head_size: 0.0
  tail_size: 0.0
