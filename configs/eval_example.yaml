# Example evaluation configuration for Dyna models
# Based on LLM Foundry eval.py pattern with Hydra integration
#
# Usage:
#   python eval.py                                    # Uses this default config
#   python eval.py --config-name=eval_example         # Explicitly use this config
#   python eval.py device=cpu                         # Override device parameter
#   python eval.py load_path=/path/to/checkpoint.pt   # Load checkpoint
#   python eval.py device=cpu precision=fp32 seed=123 # Multiple overrides

# Evaluation Parameters
eval_config:
  seed: 42
  precision: amp_bf16
  device: gpu
  dist_timeout: 300
  run_name: dyna_eval
  # Tokenizer Configuration
  tokenizer: HuggingFaceTB/SmolLM2-1.7B
  

# Model Configuration (single model format - training style)

model_config:
    execution_mode: transformer
    d_model: 768
    d_ffn: 3072
    n_repeats: 2
    n_heads: 12
    d_head: 64
    n_layers: 6
    vocab_size: 50368
    max_seq_len: 1024
    n_expert_shared_attn: 0
    n_expert_shared_ffn: 0
    collect_reg_loss: False
    enable_early_exit: False
    norm_structure: pre
    rescaling_method: complete_p
    loop_normalization: False
    sample_iterations: False
    loop_rope_theta_rebase: False
    transformer_type: dyna
    layer_type: simple
    base_depth: 2
    current_depth: 12
    base_width: 256
    current_width: 768
    cp_alpha: 1
    sqrt_attention_scale: False
    use_embedding_norm: False
    init_sigma: 0.02
    load_path: "s3://loop-llm/dyna/test-ba3171.pt"




# Loggers
loggers:
  wandb:
    project: dyna
    log_artifacts: false
    name: ${eval_config.run_name}

# Callbacks (optional)
callbacks: {}

# Alternative: Multiple models format (eval style)
# Uncomment to evaluate multiple models
